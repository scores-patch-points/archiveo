<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>archiveo</title>
<meta name="description" content="Cite exact bytes. Point archiveo at any link, such as archive.org, name the byte ranges, and the ranges live in the URL.">
<script>
/* Set the theme before first paint so a modal never flashes the wrong one. */
(function () {
  var t = null;
  try { t = new URLSearchParams(location.search).get('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') { try { t = localStorage.getItem('archiveo.theme'); } catch (e) { t = null; } }
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<script src="vendor/alhazen.js"></script>
<style>
/* Plain, conventional page furniture: system fonts, neutral grays, ordinary links and buttons.
   Our purple (#51489a on light, #b8b0e0 on dark, from the EO "Existence" cards on mikelacy.site) is the only accent;
   the oracle video's lower-third red (#d52824) marks quotations. */
:root{
  color-scheme:light;
  --bg:#ffffff; --bg2:#f5f5f5; --fg:#222222; --strong:#000000; --name:#111111; --desc:#444444; --muted:#666666;
  --hair:#d9d9d9; --badge:#b5b5b5; --accent:#51489a; --accent-hi:#3a3378; --accent-bg:#ece9f7; --on-accent:#ffffff;
  --cite:#d52824; --tint:rgba(81,72,154,.14); --tint2:rgba(81,72,154,.32);
  --err:#a3211e; --err-bg:#fbe9e7; --warn:#6b4e00; --warn-bg:#fff4d6;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1b1b1b; --bg2:#242424; --fg:#d6d6d6; --strong:#f2f2f2; --name:#eaeaea; --desc:#b4b4b4; --muted:#9a9a9a;
  --hair:#383838; --badge:#585858; --accent:#b8b0e0; --accent-hi:#d6d0f3; --accent-bg:#2d2b3b; --on-accent:#1b1b1b;
  --tint:rgba(184,176,224,.17); --tint2:rgba(184,176,224,.36);
  --err:#f2a09a; --err-bg:#3a1f1d; --warn:#e3c374; --warn-bg:#332b14;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{font-size:14px;color:var(--name);background:var(--bg2);border:1px solid var(--badge);border-radius:4px;padding:4px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--hair)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover:not(:disabled){background:var(--accent-hi);border-color:var(--accent-hi)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover:not(:disabled){background:var(--bg2);border-color:var(--hair);color:var(--name)}
input[type=text],select{background:var(--bg);border:1px solid var(--badge);border-radius:4px;padding:5px 8px;min-width:0;color:var(--name)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::placeholder{color:var(--muted);opacity:1}
a{color:var(--accent)}
a:hover{color:var(--accent-hi)}
code{font:12.5px var(--mono);background:var(--bg2);border:1px solid var(--hair);border-radius:3px;padding:0 4px}

/* shell */
.shell{position:relative;height:100%;display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr);grid-template-rows:46px minmax(0,1fr);grid-template-areas:"top top" "nav stage"}
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--hair);background:var(--bg);min-width:0}
.brand{border:0;padding:0;background:none;font:700 17px var(--sans);color:var(--strong)}
.brand:hover:not(:disabled){background:none;color:var(--accent)}
.brand:disabled{opacity:1;cursor:default}
.crumbs{display:flex;gap:8px;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumbs span{overflow:hidden;text-overflow:ellipsis}
.crumbs .cur{color:var(--name)}
.grow{flex:1}
.icon{width:30px;height:28px;padding:0;display:inline-grid;place-items:center;flex:none}
#navtoggle{display:none}
.nav{grid-area:nav;display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--hair);background:var(--bg2)}
.navhead{padding:14px 16px 0}
.back{border:0;padding:0;background:none;color:var(--accent);font-size:13px}
.back:hover:not(:disabled){background:none;text-decoration:underline}
.ntitle{margin-top:8px}
.ntitle strong{display:block;color:var(--strong);font-size:15px;overflow-wrap:anywhere}
.nmeta{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.nmeta.warn{color:var(--warn)}
.sect{display:flex;justify-content:space-between;padding:16px 16px 6px;font-size:12px;font-weight:700;color:var(--muted)}
.navform{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 12px}
.navform input{flex:1 1 110px}
.navform .msg{flex-basis:100%;font-size:12px;color:var(--err)}
.navform.stack input{flex:1 1 100%}
.navform.stack button{margin-left:auto}
.navform .msg:empty{display:none}
.navlist{flex:1;min-height:0;overflow:auto;border-bottom:1px solid var(--hair)}
.empty{margin:14px 16px;color:var(--muted)}
.row{display:flex;border-top:1px solid var(--hair)}
.row.active{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent)}
.rmain{flex:1;min-width:0;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:0 8px;align-items:start;text-align:left;background:transparent;border:0;border-radius:0;padding:10px 6px 10px 16px}
.rmain:hover:not(:disabled){background:var(--bg);color:var(--name)}
.badge{display:inline-block;border:1px solid var(--hair);border-radius:3px;padding:1px 4px;min-width:30px;text-align:center;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;background:var(--bg)}
.badge.dir{color:var(--accent);border-color:var(--accent)}
.badge.err{color:var(--err);border-color:var(--err)}
.rtitle{display:block;color:var(--name);font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.rmeta{display:block;color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.rcount{color:var(--muted);font-size:12px;padding-top:3px;font-variant-numeric:tabular-nums}
.rdel{border:0;border-radius:0;background:transparent;color:var(--muted);padding:0 14px;opacity:0}
.row:hover .rdel,.rdel:focus-visible{opacity:1}
@media (hover:none){.rdel{opacity:1}}
.stage{grid-area:stage;overflow:auto;min-width:0;min-height:0;padding:0 clamp(16px,4vw,44px) 56px;outline:none}
.inner{max-width:860px;margin:0 auto}
#scrim{display:none}

/* hero */
.hero{padding:32px 0 6px}
.eyebrow{margin:0 0 6px;font-size:13px;color:var(--muted)}
.hero h1{margin:0 0 10px;font:700 clamp(24px,4vw,30px)/1.2 var(--sans);color:var(--strong)}
.lede{margin:0 0 22px;max-width:62ch;font-size:16px;color:var(--desc)}
.subhead{margin:24px 0 10px;font-size:13px;font-weight:700;color:var(--muted)}

/* quotation: a plain blockquote with the video's red rule */
.quote{display:block;width:100%;text-align:left;margin:0 0 14px;padding:14px 18px 12px;background:var(--bg2);border:0;border-left:4px solid var(--cite);border-radius:0;font-family:var(--sans);color:var(--strong);text-decoration:none}
a.quote:hover,button.quote:hover:not(:disabled){background:var(--bg2);color:var(--strong);box-shadow:0 0 0 1px var(--badge)}
.qtext{margin:0 0 10px;font:400 16px/1.5 var(--sans);color:var(--strong);overflow-wrap:anywhere}
.qtext.dim{color:var(--muted)}
.who{display:block;font:700 14px/1.3 var(--sans);color:var(--strong)}
input.who{width:100%;padding:2px 0;border:0;border-bottom:1px dashed transparent;border-radius:0;background:transparent}
input.who:hover,input.who:focus{border-bottom-color:var(--badge)}
.cite{margin-top:2px;font:400 13px/1.4 var(--sans);color:var(--muted);overflow-wrap:anywhere}

/* the span as the original wrote it */
.doc{white-space:pre-wrap;overflow-wrap:anywhere;tab-size:8;font:16px/1.55 var(--sans);color:var(--strong);margin:0 0 10px}
.doc.mono{font:13.5px/1.55 var(--mono)}
.doc .ctx{color:var(--muted)}
.doc mark{background:var(--tint);color:inherit;border-radius:2px}
.doc hr.pb{border:0;border-top:1px dashed var(--badge);margin:1em 0}
.doc.html{white-space:normal}
.doc.html>*:first-child{margin-top:0}
.doc.html p{margin:0 0 .8em}
.doc.html h1,.doc.html h2,.doc.html h3,.doc.html h4,.doc.html h5,.doc.html h6{margin:1em 0 .4em;line-height:1.25}
.doc.html h1{font-size:1.6em}.doc.html h2{font-size:1.35em}.doc.html h3{font-size:1.15em}
.doc.html blockquote{margin:.8em 0;padding-left:1em;border-left:3px solid var(--badge);color:var(--desc)}
.doc.html ul,.doc.html ol{margin:.6em 0;padding-left:1.6em}
.doc.html pre{white-space:pre-wrap;font:13px/1.5 var(--mono);background:var(--bg);padding:8px 10px;border:1px solid var(--hair)}
.doc.html code{font-size:.9em}
.doc.html table{border-collapse:collapse;margin:.8em 0;font-size:.95em}
.doc.html td,.doc.html th{border:1px solid var(--badge);padding:3px 8px;vertical-align:top}
.doc.html hr{border:0;border-top:1px solid var(--badge)}
.clip{max-height:11.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}

/* span view */
.spanview{padding-top:26px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.actions button{font-size:13px;padding:3px 10px}
.bytehead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-top:14px;padding:12px 0;border-top:1px solid var(--hair)}
.bytehead .lab{font-size:13px;font-weight:700;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted)}
.controls label{display:flex;gap:6px;align-items:center}
.controls select{padding:2px 6px;font-size:13px}
.seg{display:inline-flex}
.segbtn{border-radius:0;padding:2px 10px;font-size:13px}
.segbtn+.segbtn{margin-left:-1px}
.segbtn:first-child{border-radius:4px 0 0 4px}
.segbtn:last-child{border-radius:0 4px 4px 0}
.segbtn[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-hi);position:relative}
pre.data{margin:0;padding:6px 0 18px;font:13px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.ctx{color:var(--muted)}
mark,.mark{background:var(--tint);color:var(--strong);border-radius:2px}
.hex{padding:6px 0 18px;overflow-x:auto;font:12.5px/1.6 var(--mono);white-space:pre}
.hex i{font-style:normal}
.haddr{margin-right:1.5ch;color:var(--muted)}
.hbytes{margin-right:1.5ch}
.hex .in{background:var(--tint);color:var(--strong)}
.hex .sel{background:var(--tint2);color:var(--strong)}
.hex.pick{user-select:none;-webkit-user-select:none}
.hex.pick i[data-o]{cursor:crosshair}
.note,.err{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:8px 0;padding:7px 10px;border-radius:4px;font-size:13px}
.note{background:var(--warn-bg);color:var(--warn)}
.err{background:var(--err-bg);color:var(--err)}
.note button,.err button{padding:1px 8px;font-size:13px;color:inherit;border-color:currentColor;background:transparent}
.muted{color:var(--muted)}
.loading{margin:14px 0;color:var(--muted)}

/* browse + find */
.bbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;font-size:13px;color:var(--muted)}
.bbar input.off{width:12ch;padding:3px 8px;font-family:var(--mono)}
.bbar button,.selbar button{padding:3px 10px;font-size:13px}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--hair);font-size:13px}
.selbar input{flex:1 1 140px}
.bview{border-top:1px solid var(--hair)}
.find{padding:12px 0;border-top:1px solid var(--hair);font-size:13px}
.find form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.find input[type=text]{flex:1 1 200px}
.find label{display:flex;gap:5px;align-items:center;color:var(--muted)}
.matches{margin-top:8px;border-top:1px solid var(--hair)}
.match{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--hair)}
.match .mo{font:12px var(--mono);color:var(--muted);flex:none}
.match .mt{flex:1 1 260px;min-width:0;font:13px/1.45 var(--mono);overflow-wrap:anywhere;white-space:pre-wrap}
.match button{padding:1px 8px;font-size:12px}

/* picker, search */
.shead{padding:26px 0 4px}
.shead h2{margin:0;font:700 22px/1.2 var(--sans);color:var(--strong);overflow-wrap:anywhere}
.shead p{margin:6px 0 0;color:var(--muted)}
.picker{margin:14px 0}
.picker input{width:100%;margin:8px 0}
.files{max-height:min(420px,50vh);overflow:auto;border-top:1px solid var(--hair)}
.files button{display:flex;width:100%;justify-content:space-between;gap:12px;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:7px 4px}
.files button:hover{background:var(--bg2)}
.files button span{color:var(--muted);white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:0;margin:0 0 12px;border-bottom:1px solid var(--hair)}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;padding:7px 14px;color:var(--muted);margin-bottom:-1px}
.tab:hover:not(:disabled){background:var(--bg2);color:var(--name)}
.tab[aria-selected=true]{color:var(--strong);font-weight:700;border-bottom-color:var(--accent)}
.sform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 6px}
.sform input[type=text]{flex:1 1 240px;padding:7px 10px}
.sform label{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:13px}
.results{margin:10px 0 0;padding:0;list-style:none}
.result{padding:12px 0;border-top:1px solid var(--hair)}
.result h3{margin:0 0 2px;font:700 16px/1.3 var(--sans)}
.result h3 button{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline}
.result h3 button:hover{color:var(--accent-hi)}
.result .by{font-size:13px;color:var(--muted)}
.result .snip{margin:6px 0 0;color:var(--desc);font-size:14px;overflow-wrap:anywhere}
.result .snip mark{background:var(--tint);color:var(--strong)}
.result .go{margin-top:6px;font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:4px 0}

/* backup countdown */
.backup{margin:8px 0 12px;padding:10px 12px;border:1px solid var(--hair);background:var(--bg2);border-radius:4px;font-size:14px}
.backup .bline{color:var(--name)}
.backup .bad{color:var(--err)}
.btrack{height:4px;margin:8px 0 2px;background:var(--hair);border-radius:2px;overflow:hidden}
.btrack i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.blinks{margin-top:6px}
.blinks p{margin:6px 0 0}
@media (prefers-reduced-motion:reduce){.btrack i{transition:none}}

/* docs */
details{border-top:1px solid var(--hair);padding:12px 0;margin:0}
details:last-of-type{border-bottom:1px solid var(--hair)}
summary{cursor:pointer;color:var(--name);font-weight:600}
details>:not(summary){max-width:72ch}
table{border-collapse:collapse;margin:10px 0;font-size:14px}
td{padding:4px 18px 4px 0;vertical-align:top}
td:first-child{white-space:nowrap}
.bar{display:flex;gap:8px}
.bar input{flex:1}
footer{margin-top:30px;color:var(--muted);font-size:13px}

/* narrow frame: sources/parts become a drawer (media queries follow the iframe, not the host page) */
@media (max-width:720px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage"}
  .nav{position:absolute;z-index:6;top:46px;bottom:0;left:0;width:min(88%,340px);transform:translateX(-104%);box-shadow:0 0 0 1px var(--hair)}
  .shell.anim .nav{transition:transform .16s ease}
  .shell.nav-open .nav{transform:none}
  #scrim{position:absolute;inset:46px 0 0 0;z-index:5;background:rgba(0,0,0,.45);border:0;border-radius:0;display:none}
  .shell.nav-open #scrim{display:block}
  #navtoggle{display:inline-grid}
  .crumbs{display:none}
  .hero{padding-top:22px}
}
@media (prefers-reduced-motion:reduce){.shell.anim .nav{transition:none}}
</style>
</head>
<body>
<div id="shell" class="shell">
  <header class="top">
    <button id="navtoggle" class="icon ghost" type="button" aria-label="Show sources and parts">☰</button>
    <button id="brand" class="brand" type="button" title="Back to the index">archiveo</button>
    <nav id="crumbs" class="crumbs" aria-label="Where you are"></nav>
    <span class="grow"></span>
    <button id="copylink" type="button" title="Copy a link that reopens this exact view">Copy link</button>
    <button id="usebtn" class="primary" type="button" hidden>Use spans</button>
    <button id="theme" class="icon ghost" type="button"></button>
    <button id="closebtn" class="icon ghost" type="button" aria-label="Close" title="Close" hidden>✕</button>
  </header>

  <aside id="nav" class="nav" aria-label="Sources and parts">
    <div id="navhead" class="navhead"></div>
    <form id="addsrc" class="navform">
      <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Paste a link or search…" aria-label="Source link or search">
      <button type="submit" class="primary">Go</button>
    </form>
    <form id="addspan" class="navform stack" hidden>
      <input id="spaninput" type="text" autocomplete="off" spellcheck="false" placeholder="1000-1199, 0x400+64, -512" aria-label="New span">
      <input id="spanlabel" type="text" autocomplete="off" placeholder="label (optional)" aria-label="Label for the new span">
      <button type="submit" class="primary">Add</button>
      <span id="spanmsg" class="msg"></span>
    </form>
    <div id="navlist" class="navlist" role="list"></div>
  </aside>
  <button id="scrim" type="button" aria-label="Close the list"></button>

  <main id="stage" class="stage" tabindex="-1"></main>
</div>

<template id="tpl-docs">
  <details id="format">
    <summary>Link format</summary>
    <p><code>#u=<i>link</i>&amp;s=<i>span</i>&amp;s=<i>span</i></code> Every <code>s=</code> belongs to the <code>u=</code> before it. Repeat <code>u=</code> for more sources.</p>
    <table>
      <tr><td><code>1000-1199</code></td><td>bytes 1000 through 1199, <b>inclusive</b>, exactly like an HTTP <code>Range</code> header (200 bytes)</td></tr>
      <tr><td><code>1000+200</code></td><td>200 bytes starting at 1000 (the same bytes)</td></tr>
      <tr><td><code>0x400-0x4ff</code></td><td>hex works anywhere a number does</td></tr>
      <tr><td><code>4096-</code></td><td>from 4096 to the end of the file</td></tr>
      <tr><td><code>-512</code></td><td>the last 512 bytes</td></tr>
      <tr><td><code>1000-1199:intro</code></td><td>a label goes after a colon (percent-encode spaces and commas)</td></tr>
      <tr><td><code>s=0-99,200-299</code></td><td>commas put several spans in one <code>s=</code></td></tr>
      <tr><td><code>f=1.2</code></td><td>open source 1, part 2 (<code>f=0</code> is the index, <code>f=1.b</code> is the file browser)</td></tr>
      <tr><td><code>c=256</code></td><td>256 bytes of context around each span</td></tr>
      <tr><td><code>v=text</code> <code>v=hex</code></td><td>start in the raw-text or hex view (the default shows the span with the original’s line breaks and layout)</td></tr>
      <tr><td><code>e=latin1</code></td><td>read the source before it as Windows-1252 (also <code>windows-1251</code>, <code>iso-8859-2</code>, and other single-byte encodings). Without it the page uses what the server or the file itself declares, else UTF-8.</td></tr>
    </table>
    <p>Shorthand for one source: <code>#https://host/file.txt@0-99,200-299</code>. It is rewritten to the full form on load.</p>
    <p>Offsets are bytes of the file exactly as the server sends it. A span is never snapped to character boundaries, so it can start or end inside a multi-byte character, and the view says so.</p>
  </details>
  <details id="sourceshelp">
    <summary>Where sources come from, and permanence</summary>
    <p>A byte span only means something if the file never changes, so archiveo prefers addresses that do not change and marks each source as <b>Permanent</b> or <b>Can change</b>.</p>
    <table>
      <tr><td>Internet Archive</td><td>files and full text; the archive keeps them</td></tr>
      <tr><td>Library of Congress</td><td>digitized books with machine-readable text</td></tr>
      <tr><td>Wikimedia</td><td>Wikisource and sister sites, opened as a pinned <b>revision</b></td></tr>
      <tr><td>Git archives</td><td>GITenberg (Project Gutenberg) and Standard Ebooks, pinned to a <b>commit</b></td></tr>
    </table>

    info.textContent = `bytes ${n0(B.off)}–${n0(B.off + bytes.length - 1)}${size != null ? ' of ' + n0(size) : ''}`;
    next.disabled = size != null ? B.off + bytes.length >= size : bytes.length < pageLen();
    prev.disabled = B.off === 0;
    const ms = marks(B.off, bytes.length);
    if (S.view === 'hex') {
      view.append(hexDump(bytes, B.off, (idx, abs) => ms.some(([lo, hi]) => abs >= lo && abs <= hi) ? 'in' : '', { perByte: true, pick: true }));
      paintHexSel(); return;
    }
    const dec = decodeText(bytes, encOf(src));
    a0 = B.off; curOffs = dec.offs;
    const cuts = ms.map(([lo, hi]) => [lower(dec.offs, lo - B.off), lower(dec.offs, hi - B.off + 1)]).filter(([x, y]) => y > x).sort((p, q) => p[0] - q[0]);
    const merged = [];
    for (const c of cuts) { const l = merged[merged.length - 1]; if (l && c[0] <= l[1]) l[1] = Math.max(l[1], c[1]); else merged.push([...c]); }
    const pre = h('pre', { class: 'data', 'data-len': dec.text.length });
    const seg_ = (c0, c1, marked) => c1 > c0 && pre.append(h('span', { class: marked ? 'seg mark' : 'seg', 'data-c': c0, text: dec.text.slice(c0, c1) }));
    let pos = 0;
    for (const [c0, c1] of merged) { seg_(pos, c0, false); seg_(c0, c1, true); pos = c1; }
    seg_(pos, dec.text.length, false);
    view.append(pre); curPre = pre;
    const badPage = encOf(src) === 'utf8' ? invalidInside(bytes) : 0;
    if (badPage > 0 && !looksBinary(bytes)) view.append(h('div', { class: 'note' }, `${n0(badPage)} byte${badPage === 1 ? '' : 's'} on this page are not valid UTF-8. `,
      h('button', { type: 'button', text: 'Decode as Latin-1', onclick: () => { src.enc = 'latin1'; commit(); } })));
  }
  function load() {
    const my = ++token, len = pageLen();
    const e = dataFor(src.url, B.off, B.off + len - 1);
    view.replaceChildren(h('p', { class: 'loading', text: 'Loading…' }));
    prev.disabled = B.off === 0;
    if (e.state === 'loading') e.waiters.add(() => draw(e, my)); else draw(e, my);
  }
  const encAtBuild = encOf(src);
  Promise.all([getSize(src.url), ensureEnc(src)]).then(() => { if (!box.isConnected) return; if (encOf(src) !== encAtBuild) render(); else load(); });
  showSel();
  return box;
}

/* ---------- stage: archive.org file picker ---------- */
const metaCache = new Map();
function ghPicker(src) {
  const repo = src.needPicker, box = h('div', { class: 'picker' });
  const crumb = h('div', { class: 'hint' }), filter = h('input', { type: 'text', placeholder: 'Filter…', 'aria-label': 'Filter files' }), list = h('div', { class: 'files' });
  box.append(crumb, filter, list);
  let sha = null, path = '', entries = [];
  const api = p => `https://api.github.com/repos/${repo}/${p}`;
  const rank = f => f.type === 'dir' ? 2 : /\.(txt|xhtml|html?|md)$/i.test(f.name) ? 0 : 1;      // regex-ok: file extension
  const pick = f => { src.url = f.download_url; src.needPicker = null; src.pickerKind = null; normalize(src); commit(); };
  function draw() {
    const q = filter.value.toLowerCase();
    crumb.replaceChildren(`${repo} at ${sha ? sha.slice(0, 7) : '…'}${path ? ' / ' + path : ''} `, path && h('button', { type: 'button', class: 'ghost', text: '← up', onclick: () => load(path.split('/').slice(0, -1).join('/')) }));
    const rows = entries.filter(f => !q || f.name.toLowerCase().includes(q));
    list.replaceChildren(...rows.slice(0, 250).map(f => h('button', { type: 'button', onclick: () => f.type === 'dir' ? load(f.path) : pick(f) },
      f.name + (f.type === 'dir' ? '/' : ''), h('span', { text: f.type === 'dir' ? 'folder' : fmtB(f.size) }))));
    if (!rows.length) list.append(h('p', { class: 'muted', text: 'Nothing here.' }));
  }
  async function load(p) {
    try {
      if (!sha) sha = (await getJson(api('commits/HEAD'))).sha;                       // list the files as of one commit, so what you pick is pinned to it
      const d = await getJson(api(`contents/${p.split('/').map(encodeURIComponent).join('/')}?ref=${sha}`));
      path = p; entries = (Array.isArray(d) ? d : []).slice().sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name)); draw();
    } catch (err) { list.replaceChildren(h('div', { class: 'err' }, explain(err).msg)); }
  }
  filter.addEventListener('input', draw);
  load('');
  return box;
}
function pickerUI(src) {
  if (src.pickerKind === 'gh') return ghPicker(src);
  const id = src.needPicker;
  const box = h('div', { class: 'picker' });
  const filter = h('input', { type: 'text', placeholder: 'Filter files…', 'aria-label': 'Filter files' });
  const list = h('div', { class: 'files' });
  box.append(filter, list);
  let files = null;
  const draw = () => {
    const q = filter.value.toLowerCase();
    const rows = files.filter(f => !q || f.name.toLowerCase().includes(q) || (f.format || '').toLowerCase().includes(q));
    list.replaceChildren(...rows.slice(0, 250).map(f => h('button', {
      type: 'button',
      onclick: () => { src.url = `https://archive.org/download/${encodeURIComponent(id)}/${f.name.split('/').map(encodeURIComponent).join('/')}`; src.needPicker = null; normalize(src); commit(); },
    }, f.name, h('span', { text: `${f.format || ''}${f.size ? ' · ' + fmtB(+f.size) : ''}` }))));
    if (rows.length > 250) list.append(h('p', { class: 'muted', text: `…and ${rows.length - 250} more. Type to narrow the list.` }));
    if (!rows.length) list.append(h('p', { class: 'muted', text: 'No files match.' }));
  };
  filter.addEventListener('input', () => files && draw());
  if (!metaCache.has(id)) metaCache.set(id, fetch(`https://archive.org/metadata/${encodeURIComponent(id)}`, { credentials: 'omit', referrerPolicy: 'no-referrer' }).then(r => r.json()));
  metaCache.get(id).then(d => {
    const rank = f => /_djvu\.txt$/i.test(f.name) ? 0 : /\.txt$/i.test(f.name) ? 1 : f.source === 'original' ? 2 : 3;      // regex-ok: file extension
    files = (d.files || []).slice().sort((p, q) => rank(p) - rank(q) || p.name.localeCompare(q.name));
    if (!files.length) list.append(h('p', { class: 'muted', text: 'archive.org has no files for that item.' })); else draw();
  }, () => { metaCache.delete(id); list.append(h('p', { class: 'muted', text: 'Couldn’t reach the archive.org metadata API.' })); });
  return box;
}

function stageSource(inner) {
  const src = S.sources[S.focus.si], si = S.focus.si;
  if (src.note) inner.append(h('div', { class: 'note', style: 'margin-top:14px', text: src.note }));
  if (src.error) { inner.append(h('div', { class: 'shead' }, h('h2', { text: 'Can’t load this' })), h('div', { class: 'err', text: src.error })); return; }
  if (src.needPicker) {
    inner.append(h('div', { class: 'shead' }, h('h2', { text: src.needPicker }), h('p', { text: src.pickerKind === 'gh' ? 'A GitHub repository. Pick a file; it opens pinned to the commit you see here.' : 'An archive.org item. Pick the file to read spans from.' })), pickerUI(src));
    return;
  }
  const perm = permanence(src.url);
  if (perm && perm.pin === 'github') inner.append(h('div', { class: 'note', style: 'margin-top:14px' }, 'This link follows a branch, so the file can change and your offsets would drift. ', h('button', { type: 'button', text: 'Pin to the current commit', onclick: ev => { ev.currentTarget.textContent = 'Pinning…'; pinGithub(src).catch(err => { ev.currentTarget.textContent = explain(err).msg; }); } })));
  if (proxy) inner.append(h('div', { class: 'note', style: 'margin-top:14px', text: `Loading through your proxy at ${srcHost(proxy.replace('{url}', 'x'))}.` }));
  const p = partOf(src, S.focus.part);
  inner.append(p === 'b' ? browsePanel(src) : spanView(src, src.spans[p], p, si));
}

/* ---------- render ---------- */
function render() {
  const top = stage.scrollTop;
  document.body.dataset.mode = S.focus ? 'source' : 'index';
  renderNav(); renderCrumbs(); syncChrome();
  const inner = h('div', { class: 'inner' });
  messages.forEach(t => inner.append(h('div', { class: 'note', style: 'margin-top:14px', text: t })));
  if (S.focus) stageSource(inner); else stageIndex(inner);
  stage.replaceChildren(inner);
  stage.scrollTop = top;
}
function applyState(st) {
  st.sources.slice(0, 50).forEach(normalize);
  messages = st.errors;
  S = { sources: st.sources.slice(0, 50), ctx: st.ctx, view: st.view, focus: resolveFocus(st.focus, st.sources, st.search), search: st.search || null };
}
function loadRoute() {
  applyState(parseRoute(readRoute()));
  const want = selfUrl(toHash(S));
  if (want !== location.pathname + location.search + location.hash) history.replaceState(null, '', want);
  render(); syncUrl(); stage.scrollTop = 0;
}
function readRoute() {
  const hs = location.hash.slice(1);
  if (hs) return hs;
  return new URLSearchParams(location.search).has('u') ? location.search.slice(1) : '';
}
function addFromInput(raw) {
  raw = raw.trim(); if (!raw) return;
  const frag = /#(u=.*)$/.exec(raw);
  if (!frag && !/^[a-z][a-z0-9+.-]*:/i.test(raw) && /^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(raw)) raw = 'https://' + raw;
  const st = parseRoute(frag ? frag[1] : raw);
  messages = st.errors;
  if (!st.sources.length) { if (frag) { messages.push('That link has no source in it.'); render(); return; } setSearch({ q: raw }); return; }
  let last = -1;
  for (const s of st.sources) {
    normalize(s);
    const at = s.error ? -1 : S.sources.findIndex(x => x.url === s.url);
    if (at >= 0) { S.sources[at].spans.push(...s.spans); if (s.enc) S.sources[at].enc = s.enc; last = at; }
    else if (S.sources.length < 50) { S.sources.push(s); last = S.sources.length - 1; }
  }
  if (frag) { S.ctx = st.ctx || S.ctx; if (st.view !== 'doc') S.view = st.view; }
  if (last >= 0) go({ si: last, part: null }); else commit();
}

/* ---------- theme ---------- */
let themePref = (() => { const t = Q.get('theme'); return t === 'light' || t === 'dark' ? t : (store.get('archiveo.theme') || 'auto'); })();
const mq = matchMedia('(prefers-color-scheme: dark)');
const currentTheme = () => themePref === 'auto' ? (mq.matches ? 'dark' : 'light') : themePref;
function applyTheme() {
  const t = currentTheme(); document.documentElement.dataset.theme = t;
  const b = $('#theme'); b.textContent = t === 'dark' ? '☀' : '☾';
  const label = t === 'dark' ? 'Switch to the light theme' : 'Switch to the dark theme';
  b.setAttribute('aria-label', label); b.title = label;
}
function toggleTheme() { themePref = currentTheme() === 'dark' ? 'light' : 'dark'; store.set('archiveo.theme', themePref); applyTheme(); }
if (mq.addEventListener) mq.addEventListener('change', () => { if (themePref === 'auto') applyTheme(); });

/* ---------- wiring ---------- */
$('#brand').onclick = openIndex;
$('#navtoggle').onclick = () => { shell.classList.add('anim'); shell.classList.toggle('nav-open'); };
$('#scrim').onclick = () => shell.classList.remove('nav-open');
$('#theme').onclick = toggleTheme;
$('#copylink').onclick = ev => copy(shareLink(), ev.currentTarget);
$('#usebtn').onclick = () => post('select', snapshot());
$('#closebtn').onclick = () => post('close');
$('#addsrc').addEventListener('submit', ev => { ev.preventDefault(); addFromInput($('#url').value); $('#url').value = ''; });
$('#addspan').addEventListener('submit', ev => {
  ev.preventDefault();
  const src = S.sources[S.focus.si], msg = $('#spanmsg');
  const parts = $('#spaninput').value.split(',').map(s => s.trim()).filter(Boolean);
  const parsed = parts.map(parseRange);
  if (!parts.length || parsed.some(p => !p)) { msg.textContent = 'Use a range like 1000-1199, 1000+200, 4096- or -512.'; return; }
  msg.textContent = '';
  const label = $('#spanlabel').value.trim();
  parsed.forEach(p => { p.label = parsed.length === 1 ? label : ''; src.spans.push(p); });
  $('#spaninput').value = ''; $('#spanlabel').value = '';
  S.focus.part = src.spans.length - 1;
  commit();
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (shell.classList.contains('nav-open')) shell.classList.remove('nav-open');
  else if (EMBED) post('close');
});
window.addEventListener('hashchange', loadRoute);

/* ---------- host page protocol (modal) ---------- */
function openFromHost(m) {
  const list = Array.isArray(m.sources) ? m.sources : (typeof m.url === 'string' ? [{ url: m.url, spans: m.spans }] : []);
  const st = { sources: [], ctx: Number.isInteger(m.ctx) ? Math.min(65536, Math.max(0, m.ctx)) : 0, view: m.view === 'hex' ? 'hex' : m.view === 'text' ? 'text' : 'doc', enc: 'utf8', focus: undefined, search: null, errors: [] };
  for (const x of list.slice(0, 50)) {
    if (!x || typeof x.url !== 'string') continue;
    const src = newSource(x.url);
    src.enc = encFromLabel(x.enc || m.enc) || null;                  // per source, falling back to the message's default
    for (const s of (Array.isArray(x.spans) ? x.spans.slice(0, 500) : [])) {
      const sp = spanFromHost(s);
      if (sp) src.spans.push(sp); else st.errors.push('A span from the host page could not be read.');
    }
    st.sources.push(src);
  }
  if (typeof m.search === 'string' && m.search.trim()) st.search = { q: m.search.trim().slice(0, 300), p: PROVIDER_IDS.includes(m.provider) ? m.provider : 'ia', m: '' };
  const f = m.focus;
  if (f === 'index' || f === null) st.focus = 'index';
  else if (f && Number.isInteger(f.source) && f.source >= 0) st.focus = { si: f.source, part: f.part === 'b' ? 'b' : Number.isInteger(f.part) && f.part >= 0 ? f.part : null };
  applyState(st);
  commit(); stage.scrollTop = 0;
}
window.addEventListener('message', ev => {
  if (!EMBED || ev.source !== window.parent) return;
  if (hostOrigin && ev.origin !== hostOrigin) return;
  const m = ev.data;
  if (!m || m.archiveo !== 1 || typeof m.type !== 'string') return;
  if (!hostOrigin) { hostOrigin = ev.origin; outbox.splice(0).forEach(o => window.parent.postMessage(o, hostOrigin)); }
  if (m.type === 'open') openFromHost(m);
  else if (m.type === 'theme' && ['light', 'dark', 'auto'].includes(m.theme)) { themePref = m.theme; applyTheme(); }
});

/* ---------- go ---------- */
applyTheme();
loadRoute();
post('ready', { version: 1 });
})();
</script>
</body>
</html>
