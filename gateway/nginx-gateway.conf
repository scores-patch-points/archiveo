# OPTIONAL and NOT USED by the default setup. archiveo reaches the gateway through an SSH tunnel and the Wayback Machine fetches
# temporary pages through the existing /samples/ route, so no nginx change is needed. Use this only if you later decide to expose
# the API publicly (then also set GATEWAY_PUBLIC instead of the FILES settings).
# Put this inside the HTTPS server block that serves hyphae.social, then:  sudo nginx -t && sudo systemctl reload nginx
location /gateway/ {
    proxy_pass http://127.0.0.1:8850/;      # the trailing slash strips /gateway/ so the service sees /backup, /t/<id>, /health
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;                    # progress lines must reach the page as they happen, for the countdown
    proxy_read_timeout 180s;
    client_max_body_size 600k;
}
